<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="./manifest.webmanifest">
<title>Golden Valley Institute — Management System</title>
<style>
/* ===== MAIN APP CSS ===== */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#f59e0b; --gold-dark:#d97706; --gold-light:#fbbf24;
  --gold-grad:linear-gradient(135deg,#f59e0b 0%,#fbbf24 50%,#d97706 100%);
  --navy:#0f172a; --navy-2:#1e293b; --navy-3:#334155;
  --slate:#64748b; --slate-2:#94a3b8; --slate-3:#cbd5e1; --slate-4:#e2e8f0; --slate-5:#f1f5f9;
  --bg:#f8fafc; --white:#fff;
  --emerald:#10b981; --emerald-light:#d1fae5;
  --rose:#f43f5e; --rose-light:#ffe4e6;
  --amber:#f59e0b; --amber-light:#fef3c7;
  --blue:#3b82f6; --blue-light:#dbeafe;
  --radius-sm:8px; --radius:12px; --radius-lg:16px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.06);
  --shadow:0 4px 12px rgba(0,0,0,.08);
  --shadow-lg:0 20px 50px rgba(0,0,0,.15);
  --transition:all .2s cubic-bezier(.4,0,.2,1);
}
*{font-family:'Inter','Segoe UI',-apple-system,sans-serif}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--navy);font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:var(--gold);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--slate-3);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:var(--slate-2)}

.app{display:grid;grid-template-columns:260px 1fr;height:100vh}
.sidebar{background:var(--navy);color:#fff;display:flex;flex-direction:column;padding:0;overflow:hidden;position:relative}
.sidebar::before{content:'';position:absolute;top:0;right:0;left:0;height:220px;background:radial-gradient(circle at 50% 0%,rgba(245,158,11,.25),transparent 70%);pointer-events:none}
.brand{padding:22px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.08);position:relative}
.brand-logo{width:44px;height:44px;border-radius:12px;background:var(--gold-grad);display:grid;place-items:center;font-size:22px;box-shadow:0 4px 14px rgba(245,158,11,.4);flex-shrink:0}
.brand-name{font-size:15px;font-weight:800;line-height:1.2;letter-spacing:-.01em}
.brand-name span{display:block;color:var(--gold-light);font-size:10.5px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;margin-top:3px}
.nav{padding:16px 12px;display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;font-size:13.5px;font-weight:500;color:rgba(255,255,255,.65);transition:var(--transition);cursor:pointer;text-align:left;width:100%}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{background:rgba(245,158,11,.15);color:var(--gold-light);font-weight:600;border-left:3px solid var(--gold)}
.nav-item .icon{font-size:16px;width:20px;text-align:center}
.nav-item .badge{margin-left:auto;background:var(--rose);color:#fff;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:700}
.sidebar-footer{padding:14px 20px;border-top:1px solid rgba(255,255,255,.08);font-size:11.5px;color:rgba(255,255,255,.4)}
.sidebar-footer b{color:var(--gold-light)}

.main{overflow-y:auto;background:var(--bg)}
.topbar{position:sticky;top:0;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--slate-4);padding:16px 32px;z-index:10;display:flex;align-items:center;gap:16px;padding-top:calc(16px + env(safe-area-inset-top))}
.topbar h1{font-size:20px;font-weight:800;letter-spacing:-.02em}
.topbar .subtitle{font-size:13px;color:var(--slate);margin-top:2px}
.topbar-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.view{padding:28px 32px 60px;max-width:1400px;margin:0 auto;height:100%;}

.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;transition:var(--transition);white-space:nowrap;border:1px solid transparent}
.btn-primary{background:var(--gold-grad);color:#fff;box-shadow:0 2px 8px rgba(245,158,11,.35)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(245,158,11,.5)}
.btn-secondary{background:var(--white);color:var(--navy);border-color:var(--slate-4)}
.btn-secondary:hover{background:var(--slate-5);border-color:var(--slate-3)}
.btn-danger{background:var(--rose);color:#fff}
.btn-danger:hover{opacity:.9}
.btn-success{background:var(--emerald);color:#fff}
.btn-ghost{color:var(--slate);padding:6px 10px}
.btn-ghost:hover{background:var(--slate-5);color:var(--navy)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-icon{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--slate);transition:var(--transition);font-size:15px}
.btn-icon:hover{background:var(--slate-5);color:var(--navy)}
.btn-icon.danger:hover{background:var(--rose-light);color:var(--rose)}

.card{background:var(--white);border-radius:var(--radius);border:1px solid var(--slate-4);box-shadow:var(--shadow-sm);overflow:hidden;margin-bottom:20px}
.card-header{padding:16px 20px;border-bottom:1px solid var(--slate-4);display:flex;align-items:center;gap:12px}
.card-title{font-size:15px;font-weight:700}
.card-body{padding:20px}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--white);border-radius:var(--radius);padding:20px;border:1px solid var(--slate-4);box-shadow:var(--shadow-sm);position:relative;overflow:hidden;transition:var(--transition)}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.stat-card .label{font-size:12px;color:var(--slate);font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.stat-card .value{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.stat-card .meta{font-size:12px;color:var(--slate);margin-top:6px}
.stat-card .icon-badge{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:18px}
.stat-card.gold .value{color:var(--gold-dark)}
.stat-card.gold .icon-badge{background:var(--amber-light);color:var(--gold-dark)}
.stat-card.emerald .value{color:var(--emerald)}
.stat-card.emerald .icon-badge{background:var(--emerald-light);color:var(--emerald)}
.stat-card.rose .value{color:var(--rose)}
.stat-card.rose .icon-badge{background:var(--rose-light);color:var(--rose)}
.stat-card.blue .value{color:var(--blue)}
.stat-card.blue .icon-badge{background:var(--blue-light);color:var(--blue)}

.table-wrap{overflow-x:auto;border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;padding:12px 16px;background:var(--slate-5);font-size:11.5px;font-weight:700;color:var(--slate);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--slate-4);white-space:nowrap}
td{padding:14px 16px;border-bottom:1px solid var(--slate-4);vertical-align:middle}
tbody tr{transition:var(--transition)}
tbody tr:hover{background:var(--slate-5)}
tbody tr:last-child td{border-bottom:none}
.cell-actions{display:flex;gap:2px;justify-content:flex-end}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid.full{grid-template-columns:1fr}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group label{font-size:12.5px;font-weight:600;color:var(--navy)}
.form-group label .req{color:var(--rose)}
.form-group input,.form-group select,.form-group textarea{padding:10px 12px;border:1.5px solid var(--slate-4);border-radius:8px;font-size:13.5px;background:var(--white);transition:var(--transition);outline:none}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,158,11,.15)}
.form-group textarea{resize:vertical;min-height:80px;font-family:inherit}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600}
.badge-success{background:var(--emerald-light);color:#047857}
.badge-warning{background:var(--amber-light);color:#92400e}
.badge-danger{background:var(--rose-light);color:#be123c}
.badge-info{background:var(--blue-light);color:#1e40af}

.filter-bar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.search-box{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--white);border:1.5px solid var(--slate-4);border-radius:8px;transition:var(--transition)}
.search-box input{flex:1;border:none;outline:none;font-size:13.5px;background:transparent}

.batch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.batch-card{background:var(--white);border-radius:var(--radius);border:1px solid var(--slate-4);padding:20px;transition:var(--transition);box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.batch-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--gold-grad)}
.batch-name{font-size:16px;font-weight:800;margin-bottom:4px}
.batch-subject{font-size:12.5px;color:var(--slate);margin-bottom:14px}

.notice-grid{display:flex;flex-direction:column;gap:12px}
.notice-card{background:var(--white);border-radius:var(--radius);border:1px solid var(--slate-4);padding:18px 20px;transition:var(--transition);border-left:4px solid var(--gold);box-shadow:var(--shadow-sm)}
.notice-card.high{border-left-color:var(--rose)}
.notice-card.medium{border-left-color:var(--amber)}
.notice-card.low{border-left-color:var(--blue)}

.empty{text-align:center;padding:60px 20px;color:var(--slate)}
.empty .emoji{font-size:52px;margin-bottom:12px;opacity:.5}
.empty h3{font-size:16px;margin-bottom:6px;color:var(--navy)}
.empty p{font-size:13px;max-width:360px;margin:0 auto 16px;line-height:1.6}

.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:60px 20px;overflow-y:auto}
.modal-overlay.open{display:flex}
.modal{background:var(--white);border-radius:var(--radius-lg);width:100%;max-width:560px;box-shadow:var(--shadow-lg);animation:slideDown .25s cubic-bezier(.4,0,.2,1);max-height:calc(100vh - 120px);display:flex;flex-direction:column}
.modal.wide{max-width:720px}
@keyframes slideDown{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--slate-4);display:flex;align-items:center;gap:12px}
.modal-header h2{font-size:17px;font-weight:800;flex:1;letter-spacing:-.01em}
.modal-close{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--slate);font-size:20px;transition:var(--transition)}
.modal-body{padding:20px 24px;overflow-y:auto;flex:1}
.modal-footer{padding:14px 24px;border-top:1px solid var(--slate-4);display:flex;justify-content:flex-end;gap:8px}

.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,60px);background:var(--navy);color:#fff;padding:12px 24px;border-radius:10px;font-size:13.5px;font-weight:500;z-index:200;opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.4,0,.2,1);box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;align-items:center;gap:8px;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.success{background:var(--emerald)}
.toast.error{background:var(--rose)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--slate-4);margin-bottom:20px}
.tab{padding:10px 18px;font-size:13.5px;font-weight:600;color:var(--slate);border-bottom:2px solid transparent;transition:var(--transition);position:relative;top:1px}
.tab.active{color:var(--gold-dark);border-bottom-color:var(--gold)}

.att-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--slate-4);transition:var(--transition)}
.att-name{flex:1;font-weight:600;font-size:13.5px}
.att-phone{font-size:12px;color:var(--slate);margin-top:2px;font-weight:400}
.att-toggle{display:flex;gap:4px;background:var(--slate-5);padding:3px;border-radius:8px}
.att-btn{padding:7px 16px;border-radius:6px;font-size:12.5px;font-weight:700;color:var(--slate);transition:var(--transition)}
.att-btn.active.present{background:var(--emerald);color:#fff}
.att-btn.active.absent{background:var(--rose);color:#fff}
.att-btn.active.late{background:var(--amber);color:#fff}

.splash{position:fixed;inset:0;background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .45s ease,visibility .45s}
.splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash-logo{width:110px;height:110px;border-radius:26px;background:var(--gold-grad);display:grid;place-items:center;font-size:56px;box-shadow:0 20px 60px rgba(245,158,11,.4);animation:pop .7s cubic-bezier(.4,0,.2,1)}
.splash-title{color:#fff;font-size:24px;font-weight:800;margin-top:22px;letter-spacing:-.02em}
.splash-sub{color:var(--gold-light);font-size:11px;font-weight:700;letter-spacing:.25em;text-transform:uppercase;margin-top:6px}
.splash-loader{margin-top:32px;width:34px;height:34px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes pop{0%{transform:scale(0);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}

.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-top:1px solid var(--slate-4);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:40;box-shadow:0 -4px 20px rgba(0,0,0,.06)}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:10px;color:var(--slate);transition:var(--transition);position:relative;-webkit-tap-highlight-color:transparent}
.bn-item.active{color:var(--gold-dark)}
.bn-item.active::before{content:'';position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:24px;height:3px;background:var(--gold);border-radius:0 0 3px 3px}
.bn-item:active{transform:scale(.94)}
.bn-icon{font-size:20px;line-height:1}
.bn-label{font-size:10px;font-weight:600}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:50;transform:translateX(-100%);transition:transform .25s;padding-top:env(safe-area-inset-top)}
  .sidebar.open{transform:translateX(0)}
  .sidebar-toggle{display:grid!important}
  .view{padding:20px 16px calc(100px + env(safe-area-inset-bottom))}
  .topbar{padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top))}
  .form-grid{grid-template-columns:1fr}
  .bottom-nav{display:flex}
  .modal-overlay{padding:0;align-items:flex-end}
  .modal{max-width:100%;border-radius:22px 22px 0 0;max-height:92vh}
  .modal-header{padding:16px 20px}
  .modal-body{padding:16px 20px}
  .modal-footer{padding:14px 20px calc(14px + env(safe-area-inset-bottom))}
  .toast{bottom:calc(90px + env(safe-area-inset-bottom))}
  .filter-bar{gap:8px}
  .stats-grid{grid-template-columns:1fr 1fr;gap:10px}
  .stat-card{padding:14px}
  .stat-card .value{font-size:22px}
}
.sidebar-toggle{display:none;width:36px;height:36px;border-radius:8px;background:var(--navy);color:#fff;font-size:18px;place-items:center}

/* ===== OMR APP CSS (Scoped) ===== */
#omr-view {
    --bg:#f3f5fb; --fg:#14213d; --card:#fff; --line:#d5dbea; --ac:#1a2f6b; --ac2:#e8b923; --ok:#1b8a3a; --bad:#c62828; --mut:#5b6580; 
    box-sizing:border-box; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding: 10px; height: 100%; overflow-y: auto; display: block;
}
@media (prefers-color-scheme:dark){#omr-view{--bg:#0f1424;--fg:#e8ecf8;--card:#182038;--line:#2c3556;--ac:#8fb0ff;--ac2:#e8b923;--ok:#58d27a;--bad:#ff6b6b;--mut:#9aa6c8}}
#omr-view header{background:linear-gradient(135deg,#1a2f6b,#2d4ba0);color:#fff;text-align:center;padding:22px 14px;border-bottom:4px solid var(--ac2); border-radius: 8px;}
#omr-view header h1{margin:0;font-size:clamp(20px,5vw,30px);letter-spacing:.06em}
#omr-view header p{margin:4px 0 0;opacity:.85;font-size:13px}
#omr-view main{max-width:1000px;margin:0 auto;padding:14px 0;}
#omr-view .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:none}
#omr-view h2{margin:0 0 10px;font-size:17px;color:var(--ac)}
#omr-view .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
#omr-view label{font-size:13px;color:var(--mut)}
#omr-view input[type=number],#omr-view textarea{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit}
#omr-view input[type=number]{width:80px}
#omr-view textarea{width:100%;min-height:60px;font-family:ui-monospace,monospace;font-size:13px}
#omr-view button,#omr-view .btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
#omr-view button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
#omr-view button.on{background:var(--ac2);color:#14213d;border-color:var(--ac2)}
#omr-view .sets button{min-width:44px}
#omr-view .keygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 14px;max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px}
#omr-view .kq{display:flex;align-items:center;gap:4px;font-size:13px}
#omr-view .kq b{width:28px;text-align:right;color:var(--mut)}
#omr-view .kq i{font-style:normal;width:26px;height:26px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;cursor:pointer;font-size:12px}
#omr-view .kq i.s{background:var(--ac);color:#fff;border-color:var(--ac)}
#omr-view .drop{border:2px dashed var(--ac);border-radius:12px;padding:22px;text-align:center;cursor:pointer}
#omr-view .drop input{display:none}
#omr-view .tw{overflow-x:auto}
#omr-view table{border-collapse:collapse;width:100%;font-size:13px}
#omr-view th,#omr-view td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
#omr-view th{color:var(--mut);font-weight:600;background:transparent}
#omr-view td.l{text-align:left}
#omr-view .sc{font-weight:700;color:var(--ac)}
#omr-view .err{color:var(--bad)}
#omr-view #stat{font-size:13px;color:var(--mut)}
#omr-view #view canvas{width:100%;border:1px solid var(--line);border-radius:8px}
#omr-view .leg span{display:inline-block;margin-right:12px;font-size:12px}
#omr-view .leg u{display:inline-block;width:12px;height:12px;border-radius:50%;border:3px solid;margin-right:4px;vertical-align:-2px}
#omr-view #camwrap{position:relative;max-width:640px;margin-top:10px}
#omr-view #vid{width:100%;display:block;border-radius:8px;background:#000}
#omr-view #ov{position:absolute;inset:0;width:100%;height:100%}
#omr-view #cstat{font-size:14px;font-weight:600;color:var(--ac)}
#omr-view .card input:not([type=file]):not([type=range]):not([type=number]){background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;min-width:110px}
#omr-view .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
#omr-view .chips div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:12px;color:var(--mut)}
#omr-view .chips b{display:block;font-size:16px;color:var(--ac)}
#omr-view td[contenteditable]{cursor:text}
#omr-view td[contenteditable]:focus{outline:2px solid var(--ac2);background:var(--bg)}
#omr-view .rs{background:#fff;color:#111;border:2px solid #a4161a;padding:18px;margin:10px 0;page-break-after:always;font-size:13px}

function $(s, r=document){ return r.querySelector(s); }
function $$(s, r=document){ return [...r.querySelectorAll(s)]; }
function uid(prefix, key){ state.counters[key]=(state.counters[key]||1000)+1; return prefix + state.counters[key]; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){ if(!iso) return '—'; return new Date(iso).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtMoney(n){ return '₹' + Number(n||0).toLocaleString('en-IN'); }

function toast(msg, type){ const el=$('#toast'); el.textContent=msg; el.className='toast show'+(type?' '+type:''); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),2500); }

function loadState(){ try{ const raw=localStorage.getItem(DB_KEY); if(raw) return JSON.parse(raw); }catch(e){} return getDefaults(); }

function batchStudents(id){ return state.students.filter(s=>s.batchId===id && s.active!==false); }
function studentPaid(id){ return state.payments.filter(p=>p.studentId===id).reduce((s,p)=>s+Number(p.amount||0),0); }
function studentBalance(s){ return Math.max(0, Number(s.totalFees||0) - studentPaid(s.id)); }
function todayAttendancePercent(){ const today=todayISO(); let present=0,total=0; Object.keys(state.attendance).forEach(key=>{ if(key.endsWith('|'+today)){ Object.values(state.attendance[key]).forEach(v=>{ total++; if(v==='P'||v==='L') present++; }); } }); return total?Math.round((present/total)*100):0; }
function totalPendingFees(){ return state.students.reduce((s,x)=>s+studentBalance(x),0); }

function openModal({title, bodyHTML, onSave, saveLabel='Save', wide=false, hideSave=false}){
  const overlay = $('#modalOverlay');

          ${hideSave?'':`<button type="submit" class="btn btn-primary">${esc(saveLabel)}</button>`}
        </div>
      </form>
    </div>`;
  overlay.classList.add('open');
  overlay.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', closeModal));
  const form = overlay.querySelector('#modalForm');
  if (onSave){ form.addEventListener('submit', e=>{ e.preventDefault(); const fd=new FormData(form); const r=onSave(fd); if(r!==false) closeModal(); }); }
  setTimeout(()=>{ const f=overlay.querySelector('input:not([type=hidden]),select,textarea'); if(f) f.focus(); }, 50);
}

}

function attachOMR(){
  const root = document.getElementById('omr-view');
  const $ = s => root.querySelector(s);
  const $$ = s => root.querySelectorAll(s);

  const OPT="ABCD",N=100,PW=595,PH=842;
  let keys={A:[],B:[],C:[],D:[]},cur="A",results=[];
  try{const k=JSON.parse(localStorage.getItem("gvi_keys")||"null");if(k)keys=k}catch(e){}
  const save=()=>{try{localStorage.setItem("gvi_keys",JSON.stringify(keys))}catch(e){}};

  /* ---------- Answer key UI ---------- */
  function renderKey(){
   const k=keys[cur];let h="";
   for(let q=0;q<N;q++){h+=`<div class="kq"><b>${q+1}</b>`+[...OPT].map(o=>`<i data-q="${q}" data-o="${o}" class="${k[q]===o?"s":""}">${o}</i>`).join("")+`</div>`}
   $("#kg").innerHTML=h;
   $("#kc").textContent=k.filter(Boolean).length+" / 100 answers set for Set "+cur;
  }
  $("#kg").onclick=e=>{const t=e.target;if(t.tagName!=="I")return;const q=+t.dataset.q,o=t.dataset.o;
   keys[cur][q]=keys[cur][q]===o?"":o;save();renderKey();rescore()};
  $$("[data-set]").forEach(b=>b.onclick=()=>{cur=b.dataset.set;
   $$("[data-set]").forEach(x=>x.className=x===b?"on":"sec");renderKey()});
  $("#apply").onclick=()=>{const s=($("#paste").value||"").toUpperCase().replace(/[^ABCD\-]/g,"");
   keys[cur]=Array.from({length:N},(_,i)=>OPT.includes(s[i])?s[i]:"");save();renderKey();rescore()};
  $("#clr").onclick=()=>{keys[cur]=[];save();renderKey();rescore()};
  ["mk","ng"].forEach(i=>$("#"+i).oninput=rescore);
  $("#sens").oninput=rescore;

  /* ---------- Image helpers ---------- */
  function loadImg(f){return new Promise((ok,no)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);ok(im)};im.onerror=()=>no(new Error("Cannot read image"));im.src=u})}
  function otsu(g){const h=new Array(256).fill(0);for(let i=0;i<g.length;i+=4)h[g[i]]++;const T=g.length/4;let s=0;for(let i=0;i<256;i++)s+=i*h[i];
   let sb=0,wb=0,m=0,best=0;for(let t=0;t<256;t++){wb+=h[t];if(!wb)continue;const wf=T-wb;if(!wf)break;sb+=t*h[t];const d=(sb/wb-(s-sb)/wf);const v=wb*wf*d*d;if(v>m){m=v;best=t}}return best}
  function findCorner(gray,w,h,thr,x0,y0,rw,rh,cx,cy){
   const seen=new Uint8Array(rw*rh);let best=null,bd=1e9;
   for(let y=0;y<rh;y++)for(let x=0;x<rw;x++){const id=y*rw+x;if(seen[id]||gray[(y0+y)*w+x0+x]>=thr)continue;
    let st=[id],n=0,mnx=x,mxx=x,mny=y,mxy=y,sx=0,sy=0;seen[id]=1;
    while(st.length){const p=st.pop(),px=p%rw,py=(p/rw)|0;n++;sx+=px;sy+=py;
     if(px<mnx)mnx=px;if(px>mxx)mxx=px;if(py<mny)mny=py;if(py>mxy)mxy=py;
     for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=px+dx,ny=py+dy;if(nx<0||ny<0||nx>=rw||ny>=rh)continue;const q=ny*rw+nx;if(!seen[q]&&gray[(y0+ny)*w+x0+nx]<thr){seen[q]=1;st.push(q)}}}
    const bw=mxx-mnx+1,bh=mxy-mny+1,fr=n/(bw*bh),ar=bw/bh;
    if(bw>w*.012&&bw<w*.08&&fr>.72&&ar>.65&&ar<1.5){const px=x0+sx/n,py=y0+sy/n,d=Math.hypot(px-cx,py-cy);if(d<bd){bd=d;best=[px,py]}}}
   return best}
  function homog(S,D){const A=[],b=[];for(let i=0;i<4;i++){const[x,y]=S[i],[u,v]=D[i];
   A.push([x,y,1,0,0,0,-u*x,-u*y]);b.push(u);A.push([0,0,0,x,y,1,-v*x,-v*y]);b.push(v)}
   for(let i=0;i<8;i++){let p=i;for(let r=i+1;r<8;r++)if(Math.abs(A[r][i])>Math.abs(A[p][i]))p=r;[A[i],A[p]]=[A[p],A[i]];[b[i],b[p]]=[b[p],b[i]];
    for(let r=0;r<8;r++){if(r===i)continue;const f=A[r][i]/A[i][i];for(let c=i;c<8;c++)A[r][c]-=f*A[i][c];b[r]-=f*b[i]}}
   return b.map((v,i)=>v/A[i][i])}

  /* ---------- Sheet geometry ---------- */
  const ansPos=(q,j)=>[45+((q/20)|0)*101+38+j*18,418+(q%20)*18.6];
  const GRIDS=[[45,5],[136,10],[312,3],[369,6]];
  const setPos=i=>[513.5,205+i*20];

  async function scan(file){
   const im=await loadImg(file),sc=Math.min(1,1600/Math.max(im.width,im.height));
   const cv=document.createElement("canvas");cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);
   const ctx=cv.getContext("2d",{willReadFrequently:true});ctx.drawImage(im,0,0,cv.width,cv.height);
   return scanCv(cv,file.name)}
  function scanCv(cv,name){
   const ctx=cv.getContext("2d",{willReadFrequently:true});
   const w=cv.width,h=cv.height,d=ctx.getImageData(0,0,w,h).data,gray=new Uint8Array(w*h);
   for(let i=0,j=0;i<d.length;i+=4,j++)gray[j]=(d[i]*.3+d[i+1]*.59+d[i+2]*.11)|0;
   const rgba=new Uint8Array(w*h*4);for(let j=0;j<gray.length;j++)rgba[j*4]=gray[j];
   const thr=Math.min(otsu(rgba)*.85,120),rw=Math.round(w*.3),rh=Math.round(h*.22);
   const tl=findCorner(gray,w,h,thr,0,0,rw,rh,0,0),tr=findCorner(gray,w,h,thr,w-rw,0,rw,rh,w,0),
    bl=findCorner(gray,w,h,thr,0,h-rh,rw,rh,0,h),br=findCorner(gray,w,h,thr,w-rw,h-rh,rw,rh,w,h);
   if(!(tl&&tr&&bl&&br))throw new Error("4 corner squares not found – retake photo");
   const Hm=homog([[26,26],[569,26],[26,816],[569,816]],[tl,tr,bl,br]);
   const mp=(u,v)=>{const z=Hm[6]*u+Hm[7]*v+1;return[(Hm[0]*u+Hm[1]*v+Hm[2])/z,(Hm[3]*u+Hm[4]*v+Hm[5])/z]};
   const s=Math.hypot(tr[0]-tl[0],tr[1]-tl[1])/543;
   const sorted=Uint8Array.from(gray).sort(),paper=Math.max(sorted[(sorted.length*.9)|0],60);
   const fill=(u,v,r)=>{const[cx,cy]=mp(u,v),R=r*s;let t=0,n=0;

  $('#attMarkAll')?.addEventListener('click', ()=>{
    $$('.att-row').forEach(r=>{

    state.attendance[bid+'|'+date]=rec; saveState(); render(); toast(`Saved (${n}) ✓`,'success');

function attachSettings(){
  $('#saveSettings')?.addEventListener('click', ()=>{
    state.settings.name=$('#settingName').value.trim();
    state.settings.tagline=$('#settingTagline').value.trim();
    state.settings.phone=$('#settingPhone').value.trim();
    state.settings.email=$('#settingEmail').value.trim();
    state.settings.address=$('#settingAddress').value.trim();
    saveState();
    $('#brandName').textContent=state.settings.name||'Golden Valley';
    toast('Saved ✓','success');
  });
  $('#exportData')?.addEventListener('click', ()=>{
    const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='gvi-backup-'+todayISO()+'.json'; a.click();
    URL.revokeObjectURL(a.href); toast('Downloaded ✓','success');
  });
  $('#importData')?.addEventListener('click', ()=>$('#importFile').click());
  $('#importFile')?.addEventListener('change', e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=ev=>{
      try {
        const d=JSON.parse(ev.target.result);
        if(!d.students||!d.batches) throw new Error('Invalid');
        if(!confirm('Replace all data?')) return;
        state=d; saveState(); render(); toast('Restored ✓','success');
      } catch(err){ toast('Invalid file','error'); }
    };
    r.readAsText(f); e.target.value='';
  });
  $('#resetData')?.addEventListener('click', ()=>{
    if(!confirm('Delete ALL data? Cannot be undone.')) return;
    if(!confirm('Absolutely sure?')) return;
    state=getDefaults(); saveState(); render(); toast('Reset done','success');
  });
}

    title:'Quick Add',
    bodyHTML:`<div style="display:grid;gap:10px">
      <button class="btn btn-secondary" data-quick="add-student" style="justify-content:flex-start;padding:14px 16px">👤 Add Student</button>
      <button class="btn btn-secondary" data-quick="add-batch" style="justify-content:flex-start;padding:14px 16px">📚 New Batch</button>
      <button class="btn btn-secondary" data-quick="add-notice" style="justify-content:flex-start;padding:14px 16px">📢 Create Notice</button>
    </div>`,
    hideSave:true, onSave:null
  });
  setTimeout(()=>{
    $$('#modalOverlay [data-quick]').forEach(el=>el.addEventListener('click', ()=>{
      closeModal(); const a=el.dataset.quick;
      if(a==='add-student') openStudentForm();
      else if(a==='add-batch') openBatchForm();
      else if(a==='add-notice') openNoticeForm();
    }));
  }, 30);
});

$('#sidebarToggle')?.addEventListener('click', ()=>$('#sidebar').classList.toggle('open'));
$$('.nav-item').forEach(el=>el.addEventListener('click', ()=>{
  navigate(el.dataset.route);
  if(window.innerWidth<=900) $('#sidebar').classList.remove('open');
}));

$$('.bn-item[data-route]').forEach(el=>el.addEventListener('click', ()=>{
  haptic(8); navigate(el.dataset.route);
}));
$('#moreBtn')?.addEventListener('click', ()=>{ haptic(8); $('#moreSheet').classList.add('open'); });
$('#moreSheet')?.addEventListener('click', e=>{ if(e.target.id==='moreSheet') $('#moreSheet').classList.remove('open'); });
$$('#moreSheet [data-route]').forEach(el=>el.addEventListener('click', ()=>{
  navigate(el.dataset.route); $('#moreSheet').classList.remove('open');
}));

function init(){
  const s=state.settings;
  if(s.name) $('#brandName').textContent=s.name;
  if(s.logo) $('#brandLogo').textContent=s.logo;
  if(!viewFilters.attBatch && state.batches.length) viewFilters.attBatch=state.batches[0].id;
  updateNav(); updateBottomNav(); render(); updateBadges();
  setTimeout(()=>{ $('#splash')?.classList.add('hide'); }, 550);
}
init();

if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  window.addEventListener('load', ()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}

})();
</script>
</body>
</html>
